# ═══════════════════════════════════════════════════════════
# DIMENSIONAL CHAOS — PALETTES
# Lighting + color worlds. A palette is more than hex codes —
# it's a Kelvin value, a volumetric density, and an HDRI.
# All HDRI slugs are real Poly Haven assets.
# ═══════════════════════════════════════════════════════════

palettes:

  golden_hour_valley:
    name: "Golden Hour Valley"
    lighting:
      sun_kelvin: 2800
      sky_kelvin: 8000
      fill_strength: 0.3
      hdri_slug: "sunset_in_the_chalk_quarry_2k"
      volumetrics:
        density: 0.03
        anisotropy: 0.6
    colors:
      dominant:
        - "#d4a574"  # amber
        - "#c27b5c"  # peach
        - "#e8c998"  # warm cream
      accent:
        - "#8a6a9e"  # bruised lavender
        - "#6b4b8a"  # violet shadow
      shadow: "#2a1f14"
    compatible_modes:
      - claymation_warmth
      - studio_ghibli_nature
      - plushcore_soft
      - isometric_diorama
    feel: "The last good hour of the day; everything touched by this light forgives itself."

  neon_nightmare:
    name: "Neon Nightmare"
    lighting:
      sun_kelvin: 3200
      sky_kelvin: 4000
      fill_strength: 0.8
      hdri_slug: "neon_photostudio_2k"
      volumetrics:
        density: 0.12
        anisotropy: 0.3
    colors:
      dominant:
        - "#ff0066"  # hot pink
        - "#00ccff"  # cyan
        - "#0a0a0f"  # oil-slick black
      accent:
        - "#ff00aa"  # magenta gel
        - "#00ff88"  # signal green
      shadow: "#050510"
    compatible_modes:
      - hyperreal_chrome
      - liminal_lowpoly
      - brutalist_sculpture
    feel: "3am in a city that refuses to sleep; every surface is a screen, every screen is a warning."

