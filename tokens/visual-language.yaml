# ═══════════════════════════════════════════════════════════
# DIMENSIONAL CHAOS — VISUAL LANGUAGE
# Maps the 3D design system vocabulary → Meshy text-to-image
# and text-to-3D prompts. Modes set treatment. Palettes set
# light and color. Forces add tension. Aspect ratios frame
# the context.
#
# Prompt template (assembled in engine/):
#   "{subject}, {mode.keywords}, {palette.color_keywords},
#    {palette.light_keywords}, {force.modifier_phrase},
#    rendered in Blender, {reference_artists},
#    {negative_prompt}"
# ═══════════════════════════════════════════════════════════

# ── MODES — Treatment vocabulary for prompt assembly ──
modes:

  claymation_warmth:
    keywords:
      - "claymation stop-motion"
      - "hand-sculpted"
      - "visible fingerprints"
      - "plasticine surface"
      - "warm tactile imperfection"
      - "stepped animation feel"
    reference_artists:
      - "Laika Studios"
      - "Aardman Animations"
      - "Henry Selick"
      - "80.lv Talent of Clay"
    negative_prompt: "smooth CGI, polished, machine-precise, sterile, digital perfection, plastic"
    preferred_aspect: "macro"

  studio_ghibli_nature:
    keywords:
      - "painterly 3D"
      - "Ghibli-style foliage"
      - "toon-shaded nature"
      - "hand-drawn feel"
      - "dense particle grass"
      - "overcast painterly light"
    reference_artists:
      - "Hayao Miyazaki"
      - "Studio Ghibli"
      - "Kazuo Oga background paintings"
      - "NPS 3D research"
    negative_prompt: "photorealistic, metallic, neon, urban, sterile, HDR"
    preferred_aspect: "wide"

  brutalist_sculpture:
    keywords:
      - "raw concrete"
      - "monolithic architecture"
      - "brutalist mass"
      - "hard shadow"
      - "exposed aggregate"
      - "no ornament"
    reference_artists:
      - "Tadao Ando"
      - "Le Corbusier"
      - "Zaki Ullah"
      - "Marcel Breuer"
    negative_prompt: "ornate, decorated, colorful, soft, organic, plush, shiny"
    preferred_aspect: "hero"

  plushcore_soft:
    keywords:
      - "felt fabric"
      - "visible stitching"
      - "rounded squish"
      - "velvet sheen"
      - "cloth simulation"
      - "stuffed plush"
    reference_artists:
      - "Sanrio product design"
      - "Jellycat plush"
      - "2026 plushcore TikTok trend"
      - "Kittl design research"
    negative_prompt: "sharp, metallic, hard-edged, industrial, chrome, concrete"
    preferred_aspect: "macro"

  hyperreal_chrome:
    keywords:
      - "liquid chrome"
      - "thin-film iridescence"
      - "product photography"
      - "polished metal"
      - "octane render"
      - "anisotropic highlights"
    reference_artists:
      - "Peter Tarka"
      - "Octane 2026 demo reels"
      - "Apple product photography"
      - "Benjamin Parry"
    negative_prompt: "matte, rough, handmade, imperfect, dusty, low-poly"
    preferred_aspect: "hero"

  liminal_lowpoly:
    keywords:
      - "PS1-era low-poly"
      - "pixelated textures"
      - "hard flat normals"
      - "empty mall space"
      - "fluorescent volumetric fog"
      - "UV shimmer"
    reference_artists:
      - "Kane Pixels Backrooms"
      - "PS1 Silent Hill"
      - "dead mall photography"
      - "kurzgesagt early style"
    negative_prompt: "high-poly, smooth, photoreal, HDR, organic detail, painterly"
    preferred_aspect: "wide"

  isometric_diorama:
    keywords:
      - "isometric 3D"
      - "tiny world diorama"
      - "tabletop miniature"
      - "orthographic camera"
      - "modular tile base"
      - "top-down 45-degree"
    reference_artists:
      - "Mohamed Chahin"
      - "Monument Valley"
      - "BlenderNation weekly features"
      - "Matthias Zarzecki"
    negative_prompt: "perspective distortion, low-angle, handheld, wide-angle lens, photorealistic humans"
    preferred_aspect: "diorama"

