# ── FORCES — Modifier phrases appended to prompts ──
forces:

  scale_distortion:
    modifier_phrase: "extreme scale distortion, bug's-eye perspective or drone-god view, familiar object at impossible size"

  light_as_character:
    modifier_phrase: "lighting as protagonist, single raking beam, volumetric god-rays, light stronger than the subject"

  material_contrast:
    modifier_phrase: "two impossible materials touching, chrome against wool, wet concrete against velvet, glass against clay"

  negative_space:
    modifier_phrase: "70% empty frame, tiny subject in vast space, reverent breathing room, atmospheric dissolve"

  impossible_physics:
    modifier_phrase: "defies gravity believably, frozen fluid mid-splash, floating mass, inverted fall, impossible staircase"

  hand_evidence:
    modifier_phrase: "visible imperfection, thumbprints, wobble, stretched UVs, intentional flaw, anti-AI handmade signal"

# ── ASPECT RATIOS — Named sizes mapped to use cases ──
aspect_ratios:
  hero: "16:9"         # hero banners, cinematic wide
  macro: "1:1"         # intimate macro, product close-up, social grid
  wide: "21:9"         # ultra-wide cinema, architectural sweep
  diorama: "4:3"       # isometric tiny worlds, editorial editorial
  portrait: "9:16"     # vertical scroll, mobile hero
  og: "1200x630"       # social share cards

# ── PROMPT TEMPLATE ──
# Assembled from:
#   subject + mode.keywords + palette.color_keywords +
#   palette.light_keywords + forces[].modifier_phrase +
#   "rendered in Blender" + mode.reference_artists +
#   mode.negative_prompt
#
# Example (claymation_warmth + golden_hour_valley + hand_evidence):
#   "a weathered rotary phone, claymation stop-motion, hand-sculpted,
#    visible fingerprints, amber #d4a574, peach #c27b5c,
#    2800K golden hour sun, long raking shadows,
#    visible imperfection, thumbprints, intentional flaw,
#    rendered in Blender, Laika Studios style, Aardman Animations,
#    negative: smooth CGI, polished, machine-precise, sterile"
